name: Validate Submission

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Explicit dispatch avoids approval-gated runs on GITHUB_TOKEN-created PRs.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to validate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  submission-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current PR revision
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number(context.payload.pull_request?.number || context.payload.inputs?.pr_number);
            if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid PR number');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            if (pr.state !== 'open' || pr.base.ref !== 'main') throw new Error('Expected an open PR to main');
            core.setOutput('number', number);
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', pr.base.sha);

      - name: Checkout trusted validation code and rules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'

      - name: Fetch submission objects without checking out student code
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"

      - name: Record validated revision
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('validation_metadata.json').write_text(json.dumps({
              'number': int(os.environ['PR_NUMBER']),
              'head': os.environ['HEAD_SHA'], 'base': os.environ['BASE_SHA']}))
          PY

      - name: Validate submission
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: bash scripts/validate.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Upload validation results
        if: ${{ always() && steps.pr.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            validation_metadata.json
            validation_result.txt
            validation_summary.md
          retention-days: 7
          if-no-files-found: error
