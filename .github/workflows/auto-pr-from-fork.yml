name: Auto PR (Fork-side Instant)

# This workflow is COPIED to every fork when a student forks the repository.
# It provides INSTANT PR creation (<30s) if the student has enabled Actions
# in their fork. If they have not (default disabled state), the upstream
# poll-forks.yml cron will still create the PR within ~10 minutes — no action
# required from the student. This file is therefore opportunistic/best-effort.
#
# Security: Runs in FORK with fork's GITHUB_TOKEN. It never needs upstream secrets.
# It only calls GitHub API to create a PR resource in upstream; it never pushes
# to upstream or reads upstream secrets.

on:
  push:
    branches:
      - main
      - "Practical-*"
      - "submission/**"
      - "prac-*"

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    # Do not run in upstream itself (avoid self-trigger when poller pushes branches)
    if: ${{ github.repository != 'ankan-web/Competitive_Programming' && github.repository != 'ankan-web/Competitive-Programming-Lab' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect upstream repository
        id: upstream
        run: |
          # Try to read upstream from parent info via API; fallback to hardcoded upstream
          # Students who forked via GitHub UI have parent set.
          UPSTREAM=$(gh api "repos/${{ github.repository }}" --jq '.parent.full_name' 2>/dev/null || echo "")
          if [ -z "$UPSTREAM" ] || [ "$UPSTREAM" = "null" ]; then
            # Fallback — update these two lines if you rename the upstream repo
            UPSTREAM="ankan-web/Competitive_Programming"
            # Alternative name:
            # UPSTREAM="ankan-web/Competitive-Programming-Lab"
          fi
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "Upstream: $UPSTREAM"
          echo "Fork: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml 2>&1 | tail -3

      - name: Determine submission metadata
        id: meta
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
        run: |
          # Detect practicals changed vs upstream main (if available) else vs previous commit
          git fetch "https://github.com/$UPSTREAM.git" main:refs/remotes/upstream/main
          BASE_SHA=$(git rev-parse refs/remotes/upstream/main)
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null | head -n 100 || git diff --name-only HEAD~1 2>/dev/null | head -n 100 || echo "")
          echo "Changed files:"
          echo "$CHANGED"

          # Extract practical numbers from changed paths
          PRACTICALS=$(echo "$CHANGED" | grep -oE "Practical-[0-9]{2}" | sort -u | tr '\n' ',' | sed 's/,$//' || echo "")
          if [ -z "$PRACTICALS" ]; then
            PRACTICALS=$(echo "$CHANGED" | grep -oE "Practical-[0-9]+" | sort -u | tr '\n' ',' | sed 's/,$//' || echo "General")
          fi
          [ -z "$PRACTICALS" ] && PRACTICALS="General"

          FIRST_PRACTICAL=$(echo "$PRACTICALS" | cut -d',' -f1)
          TITLE="Submission: ${FIRST_PRACTICAL} - ${ACTOR}"
          if echo "$PRACTICALS" | grep -q ","; then
            TITLE="Submission: ${PRACTICALS} - ${ACTOR}"
          fi

          # Build file list for body
          FILE_LIST=$(echo "$CHANGED" | grep -E "Practical-[0-9]+/" | sed 's/^/- /' | head -n 50 || true)
          [ -z "$FILE_LIST" ] && FILE_LIST="- (no Practical-* files detected — check folder structure)"

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "practicals=$PRACTICALS" >> "$GITHUB_OUTPUT"
          {
            echo "file_list<<EOF"
            echo "$FILE_LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Title: $TITLE"
          echo "Practicals: $PRACTICALS"

      - name: Create or update PR to upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: ${{ steps.upstream.outputs.upstream }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRACTICALS: ${{ steps.meta.outputs.practicals }}
          FILE_LIST: ${{ steps.meta.outputs.file_list }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          python3 - << 'PY'
          import os, subprocess, json, sys, urllib.request, urllib.error

          upstream = os.environ["UPSTREAM"]
          branch = os.environ["BRANCH"]
          title = os.environ["TITLE"]
          practicals = os.environ.get("PRACTICALS","")
          fork = os.environ.get("GITHUB_REPOSITORY","")
          actor = os.environ.get("GITHUB_ACTOR","")
          token = os.environ.get("GH_TOKEN","")
          file_list = os.environ.get("FILE_LIST","")  # from meta step — passed via env file?
          # file_list is in step output, not env — rebuild from git diff
          try:
              changed = subprocess.check_output(["git","diff","--name-only", "refs/remotes/upstream/main...HEAD"], text=True)
          except:
              try:
                  changed = subprocess.check_output(["git","diff","--name-only", "HEAD~1"], text=True)
              except:
                  changed = ""
          files = [f.strip() for f in changed.splitlines() if f.strip()]
          practical_files = [f for f in files if f.startswith("Practical-")]
          if not practical_files:
              practical_files = files[:20]

          api = "https://api.github.com"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "auto-pr-from-fork"
          }

          def gh_api(method, path, data=None):
              url = api + path
              body = json.dumps(data).encode() if data else None
              req = urllib.request.Request(url, data=body, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read().decode() or "{}"), dict(r.headers)
              except urllib.error.HTTPError as e:
                  b = e.read().decode()
                  try:
                      j = json.loads(b) if b else {}
                  except:
                      j = {"raw": b}
                  return e.code, j, dict(e.headers)

          # Check for existing open PR with same head (forkOwner:branch)
          fork_owner = fork.split("/")[0] if "/" in fork else ""
          head_ref = f"{fork_owner}:{branch}"
          print(f"Checking existing PRs head={head_ref} in {upstream}")
          status, data, _ = gh_api("GET", f"/repos/{upstream}/pulls?state=open&head={head_ref}&per_page=10")
          if status != 200:
              print(f"GET pulls failed {status}: {data}")
              # fallback to search by title
              data = []

          existing = None
          if isinstance(data, list) and len(data) > 0:
              existing = data[0]
              print(f"Found existing PR #{existing['number']}: {existing['title']}")

          # Build body
          file_bullet = "\n".join(f"- `{f}`" for f in practical_files[:50]) if practical_files else "- (no files detected)"
          body = f"""## Competitive Programming Lab Submission

          **Student:** {actor} (`{fork}`)
          **Branch:** `{branch}`
          **Practicals:** {practicals}

          ### Submitted Files
          {file_bullet}

          ### Automated Checks
          - [ ] Directory structure (validated by CI)
          - [ ] File type validation
          - [ ] Compilation check
          - [ ] No prohibited files

          > This PR was automatically created by the repository submission system.
          > Fork: `{fork}` → Upstream: `{upstream}`
          > Subsequent pushes to the same branch will update this PR automatically.
          """

          if existing:
              num = existing["number"]
              print(f"Updating body of PR #{num}")
              s, j, _ = gh_api("PATCH", f"/repos/{upstream}/pulls/{num}", {"body": body, "title": title})
              print(f"PATCH status {s}: {j.get('html_url', j)}")
              if s not in (200,201):
                  print(f"Update failed, creating comment instead")
                  gh_api("POST", f"/repos/{upstream}/issues/{num}/comments", {"body": f"Updated submission: {practicals}\n\n{file_bullet}"})
          else:
              print(f"Creating new PR head={head_ref} base=main title={title}")
              payload = {"title": title, "head": head_ref, "base": "main", "body": body, "draft": False}
              s, j, _ = gh_api("POST", f"/repos/{upstream}/pulls", payload)
              print(f"POST status {s}: {json.dumps(j, indent=2)[:2000]}")
              if s not in (200,201):
                  msg = j.get("message","") + " " + str(j.get("errors",""))
                  if "pull request already exists" in msg.lower() :
                      print("PR already exists (race with poller) — ignoring.")
                  else:
                      # Helpful hint if Actions are disabled or token lacks permission
                      print("::warning::Auto-PR failed. This is expected if Actions are disabled in fork or token lacks permission. Upstream poller will create the PR within ~10 minutes.")
                      # Do not fail the workflow — poller is fallback
                  sys.exit(0)
          PY
