name: Publish Validation Results

on:
  workflow_run:
    workflows: ["Validate Submission"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # This workflow runs from BASE branch (trusted) — safe to use GITHUB_TOKEN with write
    # It never checks out or executes PR head code; it only reads artefact data as text.
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    steps:
      - name: Download validation artefacts
        uses: actions/download-artifact@v4
        with:
          name: validation-results-${{ github.event.workflow_run.pull_requests[0].number }}
          path: ./artefacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read results
        id: read
        run: |
          echo "PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}"
          ls -R ./artefacts || true
          # fallbacks if artefact missing (e.g. fork PR from private)
          cat ./artefacts/validation_summary.md 2>/dev/null || echo "No validation summary." > ./artefacts/validation_summary.md
          cat ./artefacts/validation_result.txt 2>/dev/null || echo "STATUS=UNKNOWN" > ./artefacts/validation_result.txt

          # Build comment body — treat artefact content as DATA, escape for markdown
          {
            echo "## Automated Validation Results"
            echo ""
            cat ./artefacts/validation_summary.md
            echo ""
            echo "---"
            echo ""
            if grep -q "^STATUS=FAIL" ./artefacts/validation_result.txt 2>/dev/null; then
              echo "> ❌ **Status: FAILED** — please fix issues above and push again."
            elif grep -q "^STATUS=PASS" ./artefacts/validation_result.txt 2>/dev/null; then
              echo "> ✅ **Status: PASSED** — ready for review."
            else
              echo "> ⚠️ Status: UNKNOWN"
            fi
            echo ""
            echo "_Results from workflow run [#${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }})_"
          } > comment_body.md
          cat comment_body.md

      - name: Find existing bot comment
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-author: "github-actions[bot]"
          body-includes: "Automated Validation Results"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: comment_body.md
          edit-mode: replace

      - name: Add labels based on result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
        run: |
          STATUS=$(cat ./artefacts/validation_result.txt 2>/dev/null | grep "^STATUS=" | cut -d= -f2 || echo UNKNOWN)
          echo "Validation: $STATUS"

          # Ensure labels exist (ignore errors if they do)
          gh api "repos/$REPO/labels" --silent 2>&1 | head -c 200 || true

          if [ "$STATUS" = "PASS" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "auto-validated,ready-for-review" --remove-label "needs-fix" 2>&1 || \
            gh api "repos/$REPO/issues/$PR/labels" -X POST -f labels='["auto-validated","ready-for-review"]' 2>&1 | tail -5 || true
          elif [ "$STATUS" = "FAIL" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label "needs-fix" --remove-label "ready-for-review" 2>&1 || \
            gh api "repos/$REPO/issues/$PR/labels" -X POST -f labels='["needs-fix"]' 2>&1 | tail -5 || true
          fi
