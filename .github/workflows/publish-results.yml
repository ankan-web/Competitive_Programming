name: Publish Validation Results

on:
  workflow_run:
    workflows: ['Validate Submission']
    types: [completed]

permissions:
  actions: read
  contents: write
  statuses: write
  pull-requests: write
  issues: write

concurrency:
  group: publish-validation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: validation-results
          path: results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and check validated revision
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const meta = JSON.parse(fs.readFileSync('results/validation_metadata.json', 'utf8'));
            const run = context.payload.workflow_run;
            if (!Number.isSafeInteger(meta.number) || !/^[a-f0-9]{40}$/.test(meta.head) || !/^[a-f0-9]{40}$/.test(meta.base)) {
              throw new Error('Invalid validation metadata');
            }
            if (!['pull_request', 'workflow_dispatch'].includes(run.event)) throw new Error('Unexpected run event');
            if (run.event === 'pull_request' && run.head_sha !== meta.head) throw new Error('Run/head mismatch');
            if (run.event === 'workflow_dispatch' && run.head_branch !== 'main') throw new Error('Dispatch must run trusted main');
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: meta.number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== meta.head) {
              core.notice('Closed, draft or superseded PR; skipping.');
              return;
            }
            core.setOutput('number', meta.number);
            core.setOutput('head', meta.head);
            core.setOutput('base', pr.base.sha);

      - name: Checkout current trusted rules
        if: steps.pr.outputs.number
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.pr.outputs.number
        with:
          python-version: '3.11'
      - if: steps.pr.outputs.number
        run: python -m pip install 'PyYAML==6.0.3'

      # Recheck with trusted code: uploaded data alone must never authorize a merge.
      - name: Revalidate exact head using current trusted rules
        if: steps.pr.outputs.number
        id: verify
        working-directory: trusted
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          git fetch origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          if bash scripts/validate.sh "$BASE_SHA" "$HEAD_SHA"; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish status, review and merge
        if: steps.pr.outputs.number && steps.verify.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          VALID: ${{ steps.verify.outputs.valid }}
        with:
          script: |
            const fs = require('fs');
            const number = Number(process.env.PR_NUMBER);
            const sha = process.env.HEAD_SHA;
            const passed = process.env.VALID === 'true' && context.payload.workflow_run.conclusion === 'success';
            const args = {...context.repo, pull_number: number};
            let {data: pr} = await github.rest.pulls.get(args);
            if (pr.state !== 'open' || pr.draft || pr.head.sha !== sha) return;
            await github.rest.repos.createCommitStatus({...context.repo, sha, context: 'validate',
              state: passed ? 'success' : 'failure', description: passed ? 'Submission rules passed' : 'Submission validation failed',
              target_url: context.payload.workflow_run.html_url});
            const body = '## Automated Validation Results\n\n' + fs.readFileSync('trusted/validation_summary.md', 'utf8').slice(0,50000)
              + '\n\nRun: ' + context.payload.workflow_run.html_url;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: number});
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.startsWith('## Automated Validation Results'));
            if (existing) await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({...context.repo, issue_number: number, body});
            const labels = passed ? ['auto-validated', 'ready-for-review'] : ['needs-fix'];
            for (const name of labels) {
              try { await github.rest.issues.createLabel({...context.repo, name, color: passed ? '0e8a16' : 'd73a4a'}); }
              catch (e) { if (e.status !== 422) throw e; }
            }
            await github.rest.issues.addLabels({...context.repo, issue_number: number, labels});
            for (const name of passed ? ['needs-fix'] : ['auto-validated', 'ready-for-review']) {
              try { await github.rest.issues.removeLabel({...context.repo, issue_number: number, name}); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            if (!passed) return;
            // Poll GitHub's asynchronous mergeability calculation; never bypass protection.
            for (let i = 0; i < 5; i++) {
              ({data: pr} = await github.rest.pulls.get(args));
              if (pr.head.sha !== sha || pr.state !== 'open' || pr.draft) return;
              if (pr.mergeable !== null) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (pr.mergeable !== true) {
              core.warning('PR has conflicts or mergeability is not ready; retry after resolving or rerunning validation.');
              return;
            }
            // GitHub cannot approve a PR authored by the same bot identity.
            if (pr.user.login !== 'github-actions[bot]') {
              await github.rest.pulls.createReview({...args, commit_id: sha, event: 'APPROVE', body: 'Configured submission checks passed.'});
            }
            const {data: result} = await github.rest.pulls.merge({...args, sha, merge_method: 'merge'});
            if (!result.merged) throw new Error(result.message);
